<!DOCTYPE html>
<html>
<head>
  <title>AI Writing Assistant</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 250px;
      padding: 15px;
      background-color: #f0f4f8;
    }
    h2 {
      margin: 0 0 10px;
      font-size: 16px;
      color: #24292e;
      text-align: center;
    }
    p {
      font-size: 13px;
      color: #586069;
      margin: 0 0 15px;
    }
    button {
      width: 100%;
      padding: 8px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid #1a7f37;
      background-color: #2ea44f;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background-color: #2c974b;
    }
  </style>
</head>
<body>
  <h2>AI Writing Assistant</h2>
  <p>The assistant is active! Use the floating button on any page to get started.</p>
  <button id="options-btn">Customize AI Settings</button>
  <script src="popup.js"></script>
</body>
</html>
